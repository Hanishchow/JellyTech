<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JellyTech - Biotechnology, Life Sciences & Scientific Engagement Club</title>
    <meta name="description" content="JellyTech — a student-led, faculty-supervised biotechnology and life-sciences club at Acharya Institute of Technology, building a continuous ecosystem of scientific exposure, research engagement and science communication." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/static/css/tetris-loader.css" />
    <style>
      /* The paper ground, set before any stylesheet loads so a slow connection
         never flashes white-on-white or leaves a dark band in the overscroll.
         The loading screen paints its own dark ground over the top of this. */
      html, body { background: #07050c; }
    </style>
  </head>
  <body>
    <div id="tl-screen" class="tl tl--screen" aria-hidden="true">
      <canvas id="bootTetris" class="tl__canvas"></canvas>
      <div class="tl--screen__overlay">
        <div class="tl--screen__pct" id="bootPct" data-tl-pct>000</div>
        <div class="tl--screen__bar"><i data-tl-bar></i></div>
      </div>
    </div>
    <script src="/static/js/tetris-loader.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
