<!DOCTYPE html>
<html class="no-js">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>JellyTech</title>

    <meta name="description" content="JellyTech">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" href="./static/img/favicon.ico">
    <link rel="stylesheet" href="./static/css/style.css" />
    <style>
      /* Pure fullscreen canvas. No overlay UI (removed per founder).
         Upstream dev chrome stays hidden. */
      html, body { height: 100%; overflow: hidden; background: #0a0610; }
      #container { position: fixed; inset: 0; }
      #container canvas { display: block; }
      #container-controls, #container-stats,
      #info, #cover-info { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Required by the sim (toggle/modal/stats bindings). Kept hidden:
         the page is pure canvas, no visible UI. Do NOT delete these. -->
    <article id="info" class="modal info-modal"></article>
    <div id="cover-info" class="modal-cover"></div>

    <div id="container-controls">
      <div id="toggle-info" class="controls-button"></div>
      <div id="toggle-dots" class="controls-button"></div>
      <div id="menu-colors" class="controls-menu"></div>
      <div id="toggle-colors" class="controls-button"></div>
      <div id="toggle-audio" class="controls-button"></div>
      <div id="toggle-postfx" class="controls-button"></div>
      <div id="toggle-sim" class="controls-button"></div>
    </div>

    <div id="container-stats" class="stats-panel">
      <div id="container-graphs"></div>
      <dl><dt>Particles</dt><dd id="particle-count"></dd></dl>
      <dl><dt>Constraints</dt><dd id="constraint-count"></dd></dl>
      <dl><dt>Forces</dt><dd id="force-count"></dd></dl>
    </div>

    <div id="container"></div>

    <script src="./static/lib/three/three.js"></script>
    <script src="./static/js/libs.develop.js"></script>
    <script src="./static/js/shader-chunks.develop.js"></script>
    <script src="./static/js/shaders.develop.js"></script>
    <script src="./static/js/app.develop.js"></script>
    <script>
      // Sim runs always (shouldAnimate defaults true). Audio omitted.
      App.STATIC_URL = "./static/";
    </script>
  </body>
</html>
